services:
  - type: web
    name: meesho-miniapp-temp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: RUN_BOT
        value: "0"
      - key: WEBAPP_URL
        value: ""
